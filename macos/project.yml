# Projekt Xcode generowany przez XcodeGen:  brew install xcodegen && xcodegen
# Bundle ID zostaje com.borderlessmouse.mac: od niego zależą zgody TCC, ustawienia i Pęk kluczy.
name: Seam
options:
  bundleIdPrefix: com.borderlessmouse
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Seam:
    type: application
    platform: macOS
    sources:
      - path: Seam/Sources
      - path: Seam/Resources
        buildPhase: resources
      - path: ../assets/seam
        includes: ["*.png"]
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Seam
        PRODUCT_BUNDLE_IDENTIFIER: com.borderlessmouse.mac
        INFOPLIST_FILE: Seam/Info.plist
        # Prywatne API wirtualnego monitora (słabo linkowane, patrz plik nagłówka).
        SWIFT_OBJC_BRIDGING_HEADER: Seam/Sources/Display/CGVirtualDisplay.h
        CODE_SIGN_ENTITLEMENTS: Seam/Seam.entitlements
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc; w Xcode wybierz swój Team, żeby uprawnienia TCC nie znikały po każdym buildzie.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
